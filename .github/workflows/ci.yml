name: CI - DevOps AI Tool

on:
  push:
    branches:
      - ci-branch
  pull_request:
    branches:
      - ci-branch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # Run tests
      - name: Run tests
        run: npm test

      # 📦 Upload test results (example)
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            test-results/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Build Docker image
      - name: Build Docker image
        run: docker build -t devops-ai-tool:${{ github.sha }} .

      # 📦 Save Docker image as artifact
      - name: Save Docker image
        run: docker save devops-ai-tool:${{ github.sha }} -o image.tar

      # 📤 Upload Docker image as artifact
      - name: Upload Docker artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

